name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Test UaDetector
        run: >
          dotnet test --project tests/UaDetector.Tests --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --coverage-output UaDetector.coverage.xml --results-directory ${{ github.workspace }}/coverage

      - name: Test UaDetector.MemoryCache
        run: >
          dotnet test --project tests/UaDetector.MemoryCache.Tests --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --coverage-output UaDetector.MemoryCache.coverage.xml --results-directory ${{ github.workspace }}/coverage

      - name: Test UaDetector.SourceGenerator
        run: >
          dotnet test --project tests/UaDetector.SourceGenerator.Tests --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --coverage-output UaDetector.SourceGenerator.coverage.xml --results-directory ${{ github.workspace }}/coverage

      - name: Test UaDetector.Abstractions
        run: >
          dotnet test --project tests/UaDetector.Abstractions.Tests --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --coverage-output UaDetector.Abstractions.coverage.xml --results-directory ${{ github.workspace }}/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ github.workspace }}/coverage
          fail_ci_if_error: true

  icons:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: icons

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: icons/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build icons package
        run: npm run build
