coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        # Overall coverage must not drop more than 1% vs. the base commit.
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        # New/changed code in a PR must be at least 80% covered.
        target: 80%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "tools/**"
